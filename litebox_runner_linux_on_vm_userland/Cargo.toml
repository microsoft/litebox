[package]
name = "litebox_runner_linux_on_vm_userland"
version = "0.1.0"
edition = "2024"
description = "Runs a Linux program in ring 3 on top of the LiteBox VM kernel"

[dependencies]
litebox = { version = "0.1.0", path = "../litebox" }
litebox_broker_local_vm_userland = { version = "0.1.0", path = "../litebox_broker_local_vm_userland" }
litebox_common_linux = { version = "0.1.0", path = "../litebox_common_linux" }
litebox_common_vm_abi = { version = "0.1.0", path = "../litebox_common_vm_abi" }
litebox_platform_vm_userland = { version = "0.1.0", path = "../litebox_platform_vm_userland" }
litebox_shim_linux = { version = "0.1.0", path = "../litebox_shim_linux", default-features = false }
litebox_util_log = { version = "0.1.0", path = "../litebox_util_log" }
log = { version = "0.4", default-features = false }

[lints]
workspace = true
