[package]
name = "litebox_guest_service"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/microsoft/litebox"
description = "Guest service that creates and supervises container processes inside LiteBox"

[[bin]]
name = "litebox-guest-service"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2.177", default-features = false }
litebox_guest_service_protocol = { version = "0.1.0", path = "../litebox_guest_service_protocol" }
ttrpc = "0.8.6"

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3"

[lints]
workspace = true
