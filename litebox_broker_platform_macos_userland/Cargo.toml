[package]
name = "litebox_broker_platform_macos_userland"
version = "0.1.0"
edition = "2024"

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "0.2.177", default-features = false }
litebox_broker_core = { path = "../litebox_broker_core", version = "0.1.0" }
litebox_broker_protocol = { path = "../litebox_broker_protocol", version = "0.1.0" }
litebox_platform = { path = "../litebox_platform", version = "0.1.0" }
rustix = { version = "1.1.2", default-features = false, features = ["event", "fs", "process", "std", "termios"] }

[features]
lock_tracing = ["litebox_platform/lock_tracing"]

[lints]
workspace = true
