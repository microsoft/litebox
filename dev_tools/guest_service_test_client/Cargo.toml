[package]
name = "guest_service_test_client"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/microsoft/litebox"
description = "Host test client that runs Linux test programs on LiteBox's stacked runners through the guest service"
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "1.0.97"
clap = { version = "4.5.33", features = ["derive"] }
litebox_guest_service_protocol = { version = "0.1.0", path = "../../litebox_guest_service_protocol" }
serde = { version = "1.0.142", features = ["derive"] }
serde_json = "1.0.142"
ttrpc = "0.8.6"

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3"

[lints]
workspace = true
