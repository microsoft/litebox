[package]
name = "litebox_common_linux"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2.9.0"
cfg-if = "1.0.0"
elf = { version = "0.8.0", default-features = false }
litebox = { path = "../litebox/", version = "0.1.0" }
litebox_broker_protocol = { path = "../litebox_broker_protocol", version = "0.1.0" }
litebox_util_log = { version = "0.1.0", path = "../litebox_util_log" }
thiserror = { version = "2.0.6", default-features = false }
int-enum = "1.2.0"
rangemap = { version = "1.5.1", features = ["const_fn"] }
syscalls = { version = "0.6", default-features = false }
zerocopy = { version = "0.8", features = ["derive", "alloc"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
litebox_syscall_rewriter = { path = "../litebox_syscall_rewriter", version = "0.1.0", default-features = false, optional = true }

[features]
# Native AArch64 Linux-guest loaders opt in; other consumers reject island payloads.
aarch64_islands = ["dep:litebox_syscall_rewriter"]
aarch64_gate_recovery = ["aarch64_islands"]

[lints]
workspace = true

[dev-dependencies]
spin = { version = "0.9.8", default-features = false, features = ["spin_mutex"] }
