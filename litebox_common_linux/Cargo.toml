[package]
name = "litebox_common_linux"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/microsoft/litebox"
description = "Common Linux-related definitions shared across LiteBox shims and platforms"

[dependencies]
bitflags = "2.9.0"
cfg-if = "1.0.0"
elf = { version = "0.8.0", default-features = false }
litebox = { path = "../litebox/", version = "0.1.0" }
litebox_util_log = { version = "0.1.0", path = "../litebox_util_log" }
litebox_util_errset = { version = "0.1.0", path = "../../litebox_util_errset" }
thiserror = { version = "2.0.6", default-features = false }
int-enum = "1.2.0"
rangemap = { version = "1.5.1", features = ["const_fn"] }
syscalls = { version = "0.6", default-features = false }
zerocopy = { version = "0.8", features = ["derive", "alloc"] }

[lints]
workspace = true

[dev-dependencies]
spin = { version = "0.9.8", default-features = false, features = ["spin_mutex"] }
