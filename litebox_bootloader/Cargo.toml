[package]
name = "litebox_bootloader"
version = "0.1.0"
edition = "2024"
links = "litebox_bootloader"
description = "Boots LiteBox kernel-mode runners: boot front ends and VmKernel bring-up"

[dependencies]
arrayvec = { version = "0.7.6", default-features = false }
litebox = { version = "0.1.0", path = "../litebox" }
litebox_platform_vm_kernel = { version = "0.1.0", path = "../litebox_platform_vm_kernel" }
litebox_util_log = { version = "0.1.0", path = "../litebox_util_log" }
log = { version = "0.4", default-features = false }
spin = { version = "0.10.0", default-features = false, features = ["once", "spin_mutex"] }
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = { version = "0.15.2", default-features = false, features = ["instructions"] }

[lints]
workspace = true
