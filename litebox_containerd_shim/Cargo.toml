[package]
name = "litebox_containerd_shim"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/microsoft/litebox"
description = "containerd runtime v2 shims that run each container in a LiteBox broker through the guest service"

# A shim per backend, as containerd finds a runtime type's shim by its name. Not one executable under
# two names: the daemon that `start` spawns is `current_exe()`, which resolves a link.
[[bin]]
name = "containerd-shim-litebox-v1"
path = "src/main.rs"

[[bin]]
name = "containerd-shim-litebox-vm-v1"
path = "src/main_vm.rs"

[[bin]]
name = "containerd-shim-litebox-ch-v1"
path = "src/main_ch.rs"

[target.'cfg(any(target_os = "linux", all(windows, target_arch = "x86_64")))'.dependencies]
containerd-shim = "0.10"
litebox_broker_core = { path = "../litebox_broker_core", version = "0.1.0" }
litebox_guest_service_protocol = { path = "../litebox_guest_service_protocol", version = "0.1.0" }
log = { version = "0.4", default-features = false, features = ["std"] }
# Not 0.7, the version `containerd-shim` 0.10 uses: 0.7 rejects valid runtime-spec 1.1 settings that
# the shim ignores, such as object-valued `linux.timeOffsets` and newer seccomp flags.
oci-spec = { version = "0.9", default-features = false, features = ["runtime"] }
serde_json = "1.0.142"
tar = { version = "0.4", default-features = false }
tar-core = { version = "0.1", default-features = false }
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.177", default-features = false }
rustix = { version = "1.1.2", default-features = false, features = ["std", "event", "fs", "mount", "process"] }

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
socket2 = { version = "0.6.3", default-features = false }
windows-sys = { version = "0.60.2", features = [
  "Win32_Foundation",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_HostComputeNetwork",
  "Win32_System_HostComputeSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[target.'cfg(any(target_os = "linux", all(windows, target_arch = "x86_64")))'.dev-dependencies]
tempfile = "3"

[target.'cfg(all(windows, target_arch = "x86_64"))'.dev-dependencies]
windows-sys = { version = "0.60.2", features = ["Win32_System_Diagnostics_ToolHelp"] }

[lints]
workspace = true
