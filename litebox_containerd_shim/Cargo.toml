[package]
name = "litebox_containerd_shim"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/microsoft/litebox"
description = "containerd runtime v2 shim that runs each container in a LiteBox broker through the guest service"

[[bin]]
name = "containerd-shim-litebox-v1"
path = "src/main.rs"

[target.'cfg(any(target_os = "linux", all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
clap = { version = "4.5.33", default-features = false, features = ["std"] }
containerd-shim = "0.10"
libc = { version = "0.2.177", default-features = false }
litebox_guest_service_protocol = { path = "../litebox_guest_service_protocol", version = "0.1.0" }
log = { version = "0.4", default-features = false, features = ["std"] }
# Not 0.7, the version `containerd-shim` 0.10 uses: 0.7 rejects valid runtime-spec 1.1 settings that
# the shim ignores, such as object-valued `linux.timeOffsets` and newer seccomp flags.
oci-spec = { version = "0.9", default-features = false, features = ["runtime"] }
rustix = { version = "1.1.2", default-features = false, features = ["std", "event", "fs", "process"] }
serde_json = "1.0.142"
tar = { version = "0.4", default-features = false }
url = "2.5.8"

[target.'cfg(target_os = "linux")'.dependencies]
litebox_runner_linux_userland = { path = "../litebox_runner_linux_userland", version = "0.1.0" }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
litebox_runner_linux_on_macos_userland = { path = "../litebox_runner_linux_on_macos_userland", version = "0.1.0" }
tempfile = "3"

[target.'cfg(any(target_os = "linux", all(target_os = "macos", target_arch = "aarch64")))'.dev-dependencies]
tempfile = "3"

[lints]
workspace = true
