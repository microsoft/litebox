[package]
name = "litebox_platform_linux_userland"
version = "0.1.0"
edition = "2024"

# The crate body is `#![cfg(target_os = "linux")]`, so on every other host it
# compiles to nothing and needs none of these. Keeping them in a target table
# (as `litebox_platform_windows_userland` already does for its Windows-only
# dependencies) stops Linux-only crates such as `seccompiler` from being built
# for a macOS or Windows host that only wants the rest of the workspace.
[target.'cfg(target_os = "linux")'.dependencies]
arrayvec = { version = "0.7.6", default-features = false }
cfg-if = "1.0.0"
getrandom = "0.3.4"
libc = { version = "0.2.169", default-features = false }
litebox = { path = "../litebox/", version = "0.1.0" }
litebox_common_linux = { path = "../litebox_common_linux", version = "0.1.0" }
litebox_common_optee = { path = "../litebox_common_optee", version = "0.1.0", default-features = false, optional = true }
spin = "0.9.8"
syscalls = { version = "0.6", default-features = false }
zerocopy = { version = "0.8", default-features = false }
seccompiler = { version = "0.5.0" }

[features]
default = ["linux_syscall"]
linux_syscall = []
optee_syscall = ["dep:litebox_common_optee"]

[lints]
workspace = true
