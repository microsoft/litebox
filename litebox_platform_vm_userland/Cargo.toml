[package]
name = "litebox_platform_vm_userland"
version = "0.1.0"
edition = "2024"
description = "LiteBox platform for a ring-3 runner on the LiteBox VM kernel"

[dependencies]
arrayvec = { version = "0.7.6", default-features = false }
litebox = { path = "../litebox/", version = "0.1.0" }
litebox_broker_local = { path = "../litebox_broker_local", version = "0.1.0" }
litebox_broker_protocol = { path = "../litebox_broker_protocol", version = "0.1.0" }
litebox_broker_transport = { path = "../litebox_broker_transport", version = "0.1.0" }
litebox_common_linux = { path = "../litebox_common_linux/", version = "0.1.0" }
litebox_common_vm_abi = { path = "../litebox_common_vm_abi", version = "0.1.0" }
litebox_platform = { path = "../litebox_platform", version = "0.1.0" }
litebox_util_log = { version = "0.1.0", path = "../litebox_util_log" }
log = { version = "0.4", default-features = false }
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
zeroize = { version = "1.8", default-features = false }

[lints]
workspace = true
