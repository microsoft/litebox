[package]
name = "litebox_broker_transport_macos_userland"
version = "0.1.0"
edition = "2024"

[dependencies]
litebox_broker_protocol = { path = "../litebox_broker_protocol", version = "0.1.0" }
litebox_broker_transport = { path = "../litebox_broker_transport", version = "0.1.0", features = ["std"] }
litebox_platform = { path = "../litebox_platform", version = "0.1.0" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "0.2.177", default-features = false }
rustix = { version = "1.1.2", default-features = false, features = ["std", "fs", "mm", "net", "shm"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
tempfile = "3"

[lints]
workspace = true
