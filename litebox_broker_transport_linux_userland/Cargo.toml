[package]
name = "litebox_broker_transport_linux_userland"
version = "0.1.0"
edition = "2024"

[dependencies]
litebox_broker_protocol = { path = "../litebox_broker_protocol", version = "0.1.0" }
litebox_broker_transport = { path = "../litebox_broker_transport", version = "0.1.0" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2.177", default-features = false }
rustix = { version = "1.1.2", default-features = false, features = ["std", "event", "fs", "mm", "net"] }

[lints]
workspace = true
