[package]
name = "litebox_runner_optee_on_vm_userland"
version = "0.1.0"
edition = "2024"
description = "Runs an OP-TEE TA in ring 3 on top of the LiteBox VM kernel"

[dependencies]
litebox = { version = "0.1.0", path = "../litebox" }
litebox_common_linux = { version = "0.1.0", path = "../litebox_common_linux" }
litebox_common_optee = { version = "0.1.0", path = "../litebox_common_optee" }
litebox_common_vm_abi = { version = "0.1.0", path = "../litebox_common_vm_abi" }
litebox_platform_vm_userland = { version = "0.1.0", path = "../litebox_platform_vm_userland" }
litebox_shim_optee = { version = "0.1.0", path = "../litebox_shim_optee", default-features = false }
litebox_util_log = { version = "0.1.0", path = "../litebox_util_log" }
log = { version = "0.4", default-features = false }
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
# Not used directly: select the software backends of the shim's `aes` and
# `sha2`, whose SIMD backends fail to compile (LLVM error) for this target.
aes = { version = "0.7.5", default-features = false, features = ["force-soft"] }
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft"] }

[lints]
workspace = true
