[package]
name = "litebox_common"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/microsoft/litebox"
description = "Common definitions shared across LiteBox shims and platforms"

[dependencies]
bitflags = "2.9.0"
litebox = { path = "../litebox/", version = "0.1.0" }
spin = { version = "0.9.8", default-features = false, features = ["once"] }
thiserror = { version = "2.0.6", default-features = false }
zerocopy = { version = "0.8", features = ["derive", "alloc"] }

[lints]
workspace = true