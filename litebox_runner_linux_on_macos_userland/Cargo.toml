[package]
name = "litebox_runner_linux_on_macos_userland"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
clap = { version = "4.5.33", features = ["derive"] }
litebox = { version = "0.1.0", path = "../litebox" }
litebox_common_linux = { version = "0.1.0", path = "../litebox_common_linux" }
litebox_platform_macos_userland = { version = "0.1.0", path = "../litebox_platform_macos_userland" }
litebox_rfb = { version = "0.1.0", path = "../litebox_rfb" }
litebox_shim_linux = { version = "0.1.0", path = "../litebox_shim_linux", default-features = false }
litebox_util_log = { version = "0.1.0", path = "../litebox_util_log", features = ["backend_tracing"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
libc = { version = "0.2.169", default-features = false }
rustls = { version = "0.23.32", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.1"

[lints]
workspace = true
