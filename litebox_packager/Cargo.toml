[package]
name = "litebox_packager"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
clap = { version = "4.5.33", features = ["derive"] }
litebox_syscall_rewriter = { version = "0.1.0", path = "../litebox_syscall_rewriter" }
rayon = "1.10"
tar = "0.4"
object = { version = "0.36.7", default-features = false, features = ["elf", "read_core"] }
sha2 = "0.10"

# OCI image support. The image architecture now follows the host, so the
# remaining constraint is `native-tls`: on non-Apple hosts it pulls in
# openssl-sys, which needs a libssl built for the same architecture. Apple hosts
# are unaffected because there `native-tls` is backed by Security.framework, so
# Apple Silicon gets OCI support alongside x86-64.
[target.'cfg(any(target_arch = "x86_64", all(target_arch = "aarch64", target_vendor = "apple")))'.dependencies]
flate2 = "1.1"
oci-client = { version = "0.16", default-features = false, features = ["native-tls"] }
oci-spec = { version = "0.9", features = ["image"] }
tempfile = "3"
tokio = { version = "1", features = ["rt"] }
walkdir = "2.0"

[lints]
workspace = true
