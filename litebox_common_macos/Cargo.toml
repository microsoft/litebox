[package]
name = "litebox_common_macos"
version = "0.1.0"
edition = "2024"

[dependencies]
litebox_trampoline = { path = "../litebox_trampoline", version = "0.1.0" }
litebox = { path = "../litebox", version = "0.1.0" }
litebox_broker_protocol = { path = "../litebox_broker_protocol", version = "0.1.0", default-features = false }
bitflags = { version = "2.13.1", default-features = false }
object = { version = "0.36.7", default-features = false, features = ["macho", "read_core"] }
zerocopy = { version = "0.8", default-features = false, features = ["alloc", "derive"] }
thiserror = { version = "2", default-features = false }

[target.'cfg(target_arch = "aarch64")'.dependencies]
litebox_common_linux = { path = "../litebox_common_linux", version = "0.1.0" }

[lints]
workspace = true
