[package]
name = "litebox_common_macos"
version = "0.1.0"
edition = "2024"

[dependencies]
litebox_syscall_rewriter = { path = "../litebox_syscall_rewriter", version = "0.1.0", default-features = false }
litebox_common_linux = { path = "../litebox_common_linux", version = "0.1.0" }
object = { version = "0.36.7", default-features = false, features = ["macho", "read_core"] }
zerocopy = { version = "0.8", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }

[lints]
workspace = true
