[package]
name = "litebox_egress_proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = { version = "1.10", default-features = false, features = ["std"] }
clap = { version = "4.5", default-features = false, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "usage",
] }
hashbrown = "0.15.2"
http-body-util = { version = "0.1.3", default-features = false }
httparse = { version = "1.10.1", default-features = false }
hyper = { version = "1.8", default-features = false, features = [
    "http1",
    "server",
] }
hyper-util = { version = "0.1.20", default-features = false, features = [
    "tokio",
] }
thiserror = { version = "2.0", default-features = false, features = ["std"] }
tokio = { version = "1.50", default-features = false, features = [
    "io-util",
    "net",
    "rt",
    "sync",
    "time",
] }

[dev-dependencies]
tokio = { version = "1.50", default-features = false, features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "test-util",
    "time",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", default-features = false }

[lints]
workspace = true
