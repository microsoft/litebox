[package]
name = "litebox_test_harness"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
litebox_timing = { version = "0.1.0", path = "../litebox_timing" }
tokio = { version = "1", features = ["rt", "net", "io-util", "io-std", "time", "macros", "fs", "process", "sync"] }

[dev-dependencies]
alacritty_terminal = "0.26.0"
libtest-mimic = "0.8"
rusqlite = { version = "0.35", features = ["bundled"] }
sha2 = "0.10"

[[test]]
name = "integration"
path = "tests/integration.rs"
harness = false

# `dashboard_store` is auto-discovered. Its impl lives in
# `tests/common/dashboard_store.rs` (subdirs are NOT auto-compiled
# as test binaries — standard cargo convention for shared test code)
# and the smoke tests in `tests/dashboard_store.rs` pull it in via
# `#[path]`.

[lints]
workspace = true
