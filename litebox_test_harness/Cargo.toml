[package]
name = "litebox_test_harness"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
litebox_timing = { version = "0.1.0", path = "../litebox_timing" }
tokio = { version = "1", features = ["rt", "net", "io-util", "io-std", "time", "macros", "fs", "process", "sync"] }

[dev-dependencies]
libtest-mimic = "0.8"

[[test]]
name = "integration"
path = "tests/integration.rs"
harness = false

[lints]
workspace = true
