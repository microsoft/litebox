name: verification

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - vlitebox
  pull_request:
  merge_group:
  workflow_dispatch:

# If a new commit is pushed to the branch before ongoing runs finish, cancel the ongoing runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXTEST_VERSION: 0.9.114

jobs:
  verification:
    name: Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'verification')
    steps:
      - name: Check out repo
        uses: actions/checkout@v6
      - name: Install Verus tools
        run: |
          .github/tools/install_verus
          echo "RUSTUP_TOOLCHAIN=$(sed -n 's/^VERUS_RUST_VERSION=//p' .github/tools/install_verus)" >> "$GITHUB_ENV"
      - name: Run verification
        run: |
          cargo clean -p litebox_platform_lvbs --target-dir target/verus-partial
          cargo verus focus -p litebox_platform_lvbs --target-dir target
      # focus can reuse an artifact previously built as an unchecked dependency.
      # Clear only the selected crate's verification artifacts before checking it.
      - name: Verify annotated broker buffer primitives
        run: |
          cargo clean -p litebox_platform --target-dir target/verus-partial
          cargo verus focus -p litebox_platform --target-dir target -- --no-cheating
      - name: Verify broker protocol primitives
        run: |
          cargo clean -p litebox_broker_protocol --target-dir target/verus-partial
          cargo verus focus -p litebox_broker_protocol --target-dir target -- --no-cheating
      - name: Verify broker implementation
        run: |
          cargo clean -p litebox_broker_core --target-dir target/verus-partial
          cargo verus focus -p litebox_broker_core --target-dir target -- --no-cheating
      - name: Verify top-level broker properties
        run: |
          cargo clean -p vlitebox --target-dir target/verus-partial
          cargo verus focus -p vlitebox --target-dir target -- --no-cheating
      - name: Reject deliberately false broker properties
        run: |
          for target in \
            object_policy_negative \
            pipe_projection_negative \
            event_projection_negative \
            timer_projection_negative \
            shared_memory_id_negative \
            shared_futex_empty_bitset_negative \
            shared_futex_alignment_negative \
            ipc_projection_negative \
            error_translation_negative \
            blocking_error_negative \
            fault_error_negative \
            file_projection_negative \
            transfer_zeroing_negative \
            channel_saturation_negative \
            channel_wakeups_negative \
            channel_extraction_negative \
            filesystem_busy_read_negative \
            filesystem_fault_write_negative \
            readonly_backend_marker_negative \
            readonly_clear_marker_negative \
            shared_buffer_empty_layout_negative \
            shared_buffer_slot_error_negative; do
            log="$RUNNER_TEMP/$target.log"
            if cargo verus focus -p vlitebox --target-dir target --example "$target" -- --no-cheating > "$log" 2>&1; then
              cat "$log"
              echo "Deliberately false property $target unexpectedly verified"
              exit 1
            fi
            cat "$log"
            grep -q "postcondition not satisfied" "$log"
          done