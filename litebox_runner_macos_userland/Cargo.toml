[package]
name = "litebox_runner_macos_userland"
version = "0.1.0"
edition = "2024"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
litebox_common_macos = { path = "../litebox_common_macos", version = "0.1.0" }
litebox_platform_macos_userland = { path = "../litebox_platform_macos_userland", version = "0.1.0" }
litebox_shim_macos = { path = "../litebox_shim_macos", version = "0.1.0" }
libc = { version = "0.2", optional = true }
litebox = { path = "../litebox", version = "0.1.0", optional = true }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dev-dependencies]
tempfile = "3"
litebox_syscall_rewriter = { path = "../litebox_syscall_rewriter", version = "0.1.0", default-features = false }
litebox = { path = "../litebox", version = "0.1.0" }

[features]
# Tests only; production stdio must be broker-backed.
test-stdio = ["litebox_shim_macos/test-stdio", "dep:libc", "dep:litebox"]

[lints]
workspace = true
