[package]
name = "litebox_broker"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
litebox_common_linux = { version = "0.1.0", path = "../litebox_common_linux", features = ["std"] }
litebox_syscall_rewriter = { path = "../litebox_syscall_rewriter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simple-dns = "0.9"
thiserror = { version = "2.0.6", default-features = false }
smoltcp = { version = "0.12.0", default-features = false, features = ["log", "proto-ipv4", "medium-ip", "socket", "socket-tcp", "socket-udp", "socket-icmp", "alloc"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
litebox_common_windows = { version = "0.1.0", path = "../litebox_common_windows", features = ["std"] }
