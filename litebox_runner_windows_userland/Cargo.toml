[package]
name = "litebox_runner_windows_userland"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
clap = { version = "4.5.33", features = ["derive"] }
litebox = { version = "0.1.0", path = "../litebox" }
litebox_common_linux = { version = "0.1.0", path = "../litebox_common_linux" }
litebox_common_windows = { version = "0.1.0", path = "../litebox_common_windows" }
litebox_platform_windows_userland = { version = "0.1.0", path = "../litebox_platform_windows_userland" }
litebox_platform_multiplex = { version = "0.1.0", path = "../litebox_platform_multiplex", default-features = false, features = ["platform_windows_userland"] }
litebox_shim_windows = { version = "0.1.0", path = "../litebox_shim_windows" }
spin = { version = "0.9.8", default-features = false, features = ["spin_mutex"] }

[features]
trace_debug = [
    "litebox_platform_windows_userland/trace_debug",
    "litebox_shim_windows/trace_debug",
]

[lints]
workspace = true
