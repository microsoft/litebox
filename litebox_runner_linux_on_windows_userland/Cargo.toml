[package]
name = "litebox_runner_linux_on_windows_userland"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/microsoft/litebox"
description = "Run Linux programs with LiteBox on unmodified Windows"

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
anyhow = "1.0.97"
clap = { version = "4.5.33", features = ["derive"] }
litebox = { version = "0.1.0", path = "../litebox" }
litebox_common_linux = { version = "0.1.0", path = "../litebox_common_linux" }
litebox_util_log = { version = "0.1.0", path = "../litebox_util_log", features = ["backend_tracing"] }
litebox_broker_local_userland = { version = "0.1.0", path = "../litebox_broker_local_userland" }
litebox_broker_transport_windows_userland = { version = "0.1.0", path = "../litebox_broker_transport_windows_userland" }
litebox_platform_windows_userland = { version = "0.1.0", path = "../litebox_platform_windows_userland" }
litebox_shim_linux = { version = "0.1.0", path = "../litebox_shim_linux", default-features = false }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[target.'cfg(all(windows, target_arch = "x86_64"))'.dev-dependencies]
litebox_syscall_rewriter = { version = "0.1.0", path = "../litebox_syscall_rewriter", default-features = false, features = ["std"] }
socket2 = { version = "0.6.3", default-features = false }
tar = "0.4"
windows-sys = { version = "0.60.2", features = ["Win32_Networking_WinSock"] }

[lints]
workspace = true