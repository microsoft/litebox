[package]
name = "litebox_broker_smoltcp"
version = "0.1.0"
edition = "2024"
description = "Broker sockets on smoltcp, for brokers with a network device but no host network stack"

[dependencies]
litebox_broker_core = { path = "../litebox_broker_core", version = "0.1.0" }
litebox_broker_protocol = { path = "../litebox_broker_protocol", version = "0.1.0" }
log = { version = "0.4", default-features = false }
smoltcp = { version = "0.12.0", default-features = false, features = ["log", "alloc", "medium-ethernet", "proto-ipv4", "socket-raw", "socket-tcp", "socket-udp"] }
spin = { version = "0.10.0", default-features = false, features = ["spin_mutex"] }

[dev-dependencies]
litebox_broker_core = { path = "../litebox_broker_core", version = "0.1.0", features = ["test-support"] }

[lints]
workspace = true
